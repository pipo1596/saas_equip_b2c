<li class="category-tree__item">
  <div class="category-tree__row">
    @if (category().children.length > 0) {
      <button
        type="button"
        class="category-tree__toggle"
        [attr.aria-expanded]="isExpanded()"
        [attr.aria-label]="(isExpanded() ? 'Collapse ' : 'Expand ') + category().categoryName"
        (click)="toggle.emit(category().progCatId)"
      >
        <svg
          class="category-tree__chevron"
          [class.category-tree__chevron--open]="isExpanded()"
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    } @else {
      <span class="category-tree__toggle-spacer" aria-hidden="true"></span>
    }
    <a
      [routerLink]="['/products', category().progCatId]"
      [queryParams]="{ name: category().categoryName }"
      class="category-tree__link"
      [class.category-tree__link--active]="isActive()"
      [attr.aria-current]="isActive() ? 'page' : null"
    >
      <span>{{ category().categoryName }}</span>
      <span class="badge rounded text-bg-light">{{ productCount() }}</span>
    </a>
  </div>
  @if (category().children.length > 0 && isExpanded()) {
    <ul class="category-tree__children list-unstyled mb-0">
      @for (child of category().children; track child.progCatId) {
        <app-category-tree-node
          [category]="child"
          [activeCategoryId]="activeCategoryId()"
          [expandedIds]="expandedIds()"
          (toggle)="toggle.emit($event)"
        />
      }
    </ul>
  }
</li>
