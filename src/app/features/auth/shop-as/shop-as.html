<main class="d-flex align-items-center justify-content-center min-vh-100 p-3 bg-dark">
  <section class="card auth-card border-0 shadow-lg p-4 p-sm-5 text-center">
    <span class="form-logo mb-3 mx-auto" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.5" />
        <path d="M5 20c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5" />
      </svg>
    </span>

    @if (state() === 'loading') {
      <h2 class="font-display fw-semibold fs-4 mb-1">Signing you in...</h2>
      <div class="d-flex justify-content-center py-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Signing you in...</span>
        </div>
      </div>
    } @else {
      <h2 class="font-display fw-semibold fs-4 mb-2">This link has expired</h2>
      <div class="alert alert-danger py-2 px-3 small mb-0" role="alert">{{ errorMessage() }}</div>
    }
  </section>
</main>
