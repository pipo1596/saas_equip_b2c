<main class="d-flex align-items-center justify-content-center min-vh-100 p-3 bg-dark">
  <section class="card auth-card border-0 shadow-lg p-4 p-sm-5">
    <span class="form-logo mb-3" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      </svg>
    </span>

    <h2 class="font-display fw-semibold fs-4 mb-1">Verify it's you</h2>
    <p class="text-secondary small mb-4">Enter the 6-digit code we sent you to finish signing in.</p>

    @if (error()) {
      <div class="alert alert-danger py-2 px-3 small" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="otp d-flex gap-2 mb-2" formArrayName="digits" role="group" aria-label="Verification code">
        @for (control of digits.controls; track $index) {
          <input
            #digitInput
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="1"
            class="otp__digit form-control text-center fs-4 fw-semibold p-0"
            [class.is-invalid]="submitted() && control.invalid"
            [formControlName]="$index"
            [attr.aria-label]="'Digit ' + ($index + 1) + ' of 6'"
            [attr.aria-invalid]="submitted() && control.invalid"
            (input)="onDigitInput($event, $index)"
            (keydown)="onDigitKeydown($event, $index)"
            (paste)="onPaste($event)"
            (focus)="onFocus($event)"
          />
        }
      </div>
      @if (digits.invalid && submitted()) {
        <p class="text-danger small" role="alert">Enter all 6 digits.</p>
      }

      <button type="submit" class="btn btn-primary w-100 mt-2" [disabled]="submitting()">
        {{ submitting() ? 'Verifying…' : 'Verify' }}
      </button>
    </form>

    <p class="text-center text-secondary small mt-4 mb-0">
      <button type="button" class="btn btn-link p-0 fw-medium" (click)="cancel()">Use a different account</button>
    </p>
  </section>
</main>
