<main class="auth-page">
  <section class="auth-card">
    <span class="form-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      </svg>
    </span>

    <h2>Verify it's you</h2>
    <p class="auth-card__lead">Enter the 6-digit code we sent you to finish signing in.</p>

    @if (error()) {
      <p class="error error--banner" role="alert">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="otp" formArrayName="digits" role="group" aria-label="Verification code">
        @for (control of digits.controls; track $index) {
          <input
            #digitInput
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="1"
            class="otp__digit"
            [class.otp__digit--invalid]="submitted() && control.invalid"
            [formControlName]="$index"
            [attr.aria-label]="'Digit ' + ($index + 1) + ' of 6'"
            [attr.aria-invalid]="submitted() && control.invalid"
            (input)="onDigitInput($event, $index)"
            (keydown)="onDigitKeydown($event, $index)"
            (paste)="onPaste($event)"
            (focus)="onFocus($event)"
          />
        }
      </div>
      @if (digits.invalid && submitted()) {
        <p class="error" role="alert">Enter all 6 digits.</p>
      }

      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Verifying…' : 'Verify' }}
      </button>
    </form>

    <p class="support">
      <button type="button" class="link" (click)="cancel()">Use a different account</button>
    </p>
  </section>
</main>
